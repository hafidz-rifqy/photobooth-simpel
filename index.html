<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📸 Photobooth Studio Lucu</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>
        <i class="fas fa-camera-retro"></i> Photobooth Lucu <i class="fas fa-heart"></i>
    </h1>
    <div class="subhead">Tekan tombol, tunggu hitungan 3-2-1, dan foto otomatis diambil 3 kali!</div>

    <div class="studio-panel">
        <div class="camera-area">
            <div class="video-wrapper">
                <video id="video" autoplay playsinline muted></video>
                <div class="flash" id="flash"></div>
                <div class="countdown-overlay" id="countdownOverlay">
                    <div class="countdown-number" id="countdownNumber">3</div>
                </div>
                <div class="camera-error" id="cameraError">
                    <i class="fas fa-video-slash"></i>
                    <p id="cameraErrorMsg">Kamera tidak bisa diakses.</p>
                    <button class="retry-camera-btn" id="retryCameraBtn"><i class="fas fa-sync-alt"></i> Coba Lagi</button>
                </div>
            </div>
            <button class="capture-btn" id="captureBtn">
                <i class="fas fa-camera"></i> Mulai Jepret (3 Foto)
            </button>
            <div class="status-counter">
                <span><i class="fas fa-images"></i> <span id="photoCount">0</span> / 3 foto</span>
            </div>
            <div class="thumbnail-strip" id="thumbnailStrip"></div>
        </div>

        <div class="frame-area">
            <div class="card">
                <h3><i class="fas fa-palette"></i> Pilih Bingkai</h3>
                <div class="frame-options" id="frameOptions">
                    <div class="frame-item selected" data-frame="pink"><i class="fas fa-heart"></i></div>
                    <div class="frame-item" data-frame="blue"><i class="fas fa-star"></i></div>
                    <div class="frame-item" data-frame="green"><i class="fas fa-leaf"></i></div>
                    <div class="frame-item" data-frame="purple"><i class="fas fa-moon"></i></div>
                    <div class="frame-item" data-frame="yellow"><i class="fas fa-sun"></i></div>
                </div>
                <div class="name-input-group" style="margin-top: 18px;">
                    <i class="fas fa-pen-fancy"></i>
                    <input type="text" id="nameInput" placeholder="Tulis namamu di sini..." maxlength="20" value="Sayang">
                </div>
            </div>

            <div class="card" style="flex:1;">
                <h3><i class="fas fa-image"></i> Hasil Photobooth</h3>
                <div class="photo-preview" id="previewContainer">
                    <div class="placeholder-text" id="placeholderText">
                        <i class="fas fa-camera" style="font-size: 2rem; display: block; margin-bottom: 10px;"></i>
                        Belum ada foto.<br>Klik tombol "Mulai Jepret" ya ✨
                    </div>
                    <div class="result-container" id="resultContainer" style="display: none;">
                        <canvas id="photoStripCanvas" width="420" height="900"></canvas>
                        <button class="save-btn" id="saveBtn"><i class="fas fa-download"></i> Simpan Foto</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="footer-note">
        <i class="fas fa-smile-wink"></i> Foto otomatis tersimpan di galeri setelah klik "Simpan"
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
